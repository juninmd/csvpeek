[project]
name = "csvpeek"
version = "1.0.0"
description = "Peek into CSV files from the terminal: schema/type inference, per-column stats, head, column select, and CSV→JSON."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["csv", "cli", "data", "inspect", "json"]
dependencies = ["typer>=0.27.3"]

[project.scripts]
csvpeek = "csvpeek.cli:app"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csvpeek"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/csvpeek/cli.py" = ["B008"]
